# GitLab Pages: publishes the dashboard (a static site; it needs no server). Runs on the default branch only.
# Works on any runner (shared, docker or a plain shell runner): it needs only a POSIX shell; Node is used for an extra
# safety check when it happens to be installed, otherwise the same files are copied with cp.
# Excel data is never uploaded: users load their workbooks in their own browser.
pages:
  stage: deploy
  script:
    - |
      if command -v node >/dev/null 2>&1; then
        node tools/build_pages.js public
      else
        rm -rf public && mkdir -p public
        cp -R index.html assets templates docs README.md public/
        test -s public/index.html
      fi
  tags: [ats-pages]               # the job runs only on a runner registered with this tag
  pages: true                     # deploys ./public (the default publish folder)
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
