# GitLab Pages: publishes the committed ./public folder (the finished static site). Runs on the default branch only.
# Deliberately has NO build step, so it works on any runner and any shell (Linux bash, Windows PowerShell, docker, ...):
# the script is one plain `echo`. Nothing needs Node or Docker on the runner.
# `public/` is generated by `npm run pages` (node tools/build_pages.js public) and a unit test fails if it is out of date.
# Excel data is never uploaded: users load their workbooks in their own browser.
pages:
  stage: deploy
  script:
    - echo "Publishing the committed public folder"
  tags: [ats-pages]               # remove this line to run on any runner; keep it if your runner was registered with this tag
  pages: true                     # deploys ./public (the default publish folder)
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
