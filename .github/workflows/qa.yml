name: QA

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04   # pinned: Playwright does not support the newer ubuntu-latest image yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run qa
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            junit-qa.xml
            test-results/
          retention-days: 14

  # Reusable package: the finished static site as a zip (host it anywhere, no runner needed there).
  # Built only after QA passes, on main and on version tags. Download it from the run's Artifacts, or from the Release for a tag (e.g. v1.0.0).
  package:
    needs: qa
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build package
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME}"; else V="${GITHUB_SHA::7}"; fi
          node tools/build_package.js "$V"
      - uses: actions/upload-artifact@v4
        with:
          name: ats-dashboard
          path: dist/*.zip
          retention-days: 90
      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --title "${{ github.ref_name }}" --generate-notes
