<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATS Program — Executive Dashboard</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/sections.css">
<link rel="stylesheet" href="assets/css/poap.css">
</head>
<body>

<!-- hidden file inputs -->
<input type="file" id="ats-folder-input" webkitdirectory directory multiple style="display:none">
<input type="file" id="ats-files-input" accept=".xlsx,.xls" multiple style="display:none">
<div class="sx-sample">SAMPLE DATA</div>

<div id="app-shell">

  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">ATS</div>
      <div class="brand-text">
        <div class="t1">ATS Program</div>
        <div class="t2" id="side-program">Executive Dashboard</div>
      </div>
    </div>

    <nav class="side-nav">
      <div class="side-group">Reporting</div>
      <button class="nav-item active" data-view="programme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Programme Overview
      </button>
      <button class="nav-item" data-view="monthly">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Monthly Council
      </button>
      <button class="nav-item" data-view="weekly">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
        Weekly Report
      </button>
      <button class="nav-item" data-view="poap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h10M3 12h14M3 18h8"/><rect x="13" y="4" width="8" height="4" rx="1"/><rect x="17" y="10" width="4" height="4" rx="1"/><rect x="11" y="16" width="8" height="4" rx="1"/></svg>
        POAP — Plan on a Page
      </button>
    </nav>

    <div class="side-foot">
      <div class="side-files" id="side-files"></div>
      <button class="btn btn-ghost btn-sm" id="btn-load-program" style="width:100%;justify-content:center;margin-bottom:6px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        Load program folder
      </button>
      <button class="btn btn-ghost btn-sm" id="btn-refresh-program" style="width:100%;justify-content:center;" title="Re-read the same folder (Chrome / Edge)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        Refresh data
      </button>
      <div class="data-status" id="program-status">No data loaded yet.</div>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <div>
        <h1 id="view-title">Programme Overview</h1>
        <div class="crumb" id="view-crumb">All portfolios side by side</div>
      </div>
      <div class="topbar-controls">
        <span id="portfolio-wrap">
          <label for="portfolio-select">Portfolio</label>
          <select id="portfolio-select" title="Choose which portfolio the Monthly Council, Weekly Report and POAP show"></select>
        </span>
        <button class="btn btn-outline" id="btn-present">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Present
        </button>
        <button class="btn btn-outline no-print" id="btn-print">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6M6 18H4a1 1 0 01-1-1v-6a1 1 0 011-1h16a1 1 0 011 1v6a1 1 0 01-1 1h-2"/><rect x="6" y="14" width="12" height="7"/></svg>
          Print / PDF
        </button>
        <button class="btn present-exit" id="btn-present-exit" style="display:none;background:#111;color:#fff;">Exit Present</button>
      </div>
    </header>

    <main id="content">
      <section class="view active" id="view-programme"></section>
      <section class="view" id="view-monthly"></section>
      <section class="view" id="view-weekly"></section>
      <section class="view" id="view-poap"></section>
    </main>
  </div>
</div>

<script src="assets/lib/xlsx.full.min.js"></script>
<script src="assets/lib/chart.umd.min.js"></script>
<script src="assets/lib/html2canvas.min.js"></script>
<script src="assets/lib/pptxgen.bundle.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/kpi-data.js"></script>
<script src="assets/js/raid.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/kpi-pages.js"></script>
<script src="assets/js/council.js"></script>
<script src="assets/js/monthly.js"></script>
<script src="assets/js/weekly.js"></script>
<script src="assets/js/programme.js"></script>
<script src="assets/js/poap.js"></script>
<script src="assets/js/pptx-export.js"></script>
<script src="assets/js/sample-data.js"></script>
<script src="assets/js/shell.js"></script>
</body>
</html>
